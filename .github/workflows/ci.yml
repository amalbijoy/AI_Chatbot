name: AI Chatbot CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m py_compile backend/server.py streamlit_app.py
      - name: Check for exposed Emergent credential pattern
        run: '! grep -R "sk-emergent-" backend streamlit_app.py PROJECT_REPORT.md'